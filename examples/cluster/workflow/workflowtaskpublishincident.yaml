apiVersion: workflow.rootly.crossplane.io/v1alpha1
kind: WorkflowTaskPublishIncident
metadata:
  name: incident-to-status-page-publish
spec:
  forProvider:
    name: Publish to status page
    position: 1
    enabled: true
    skipOnFailure: false
    # Publishing acts on the incident, so this is a step of the
    # incident-triggered workflow, not the alert one.
    workflowIdRef:
      name: incident-to-status-page
    taskParams:
      - statusPageIdRef:
          name: public
        incident:
          id: "{{ incident.id }}"
          name: "{{ incident.id }}"
        publicTitle: "{{ incident.title }}"
        status: investigating
        event: |
          We are investigating {{ incident.title }}.

          Severity: {{ incident.severity }}
        notifySubscribers: true
  providerConfigRef:
    name: default
